# Server
server.port=8082

# OpenAI
openai.api.key=YOUR_OPENAI_API_KEY_HERE
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o

# Unsplash
unsplash.api.key=YOUR_UNSPLASH_ACCESS_KEY_HERE
unsplash.api.url=https://api.unsplash.com
unsplash.results.limit=5

# CORS - allow both frontend apps
cors.allowed.origins=http://localhost:5173,http://localhost:5174

# Logging
logging.level.com.satellite=DEBUG
